substitutions:
  _REGION: asia-southeast1
  _SERVICE: teachback-ai
  _REPOSITORY: teachback
  _RUNTIME_SA: teachback-runtime@teachback-ai-511214.iam.gserviceaccount.com
  _GEMINI_MODEL: gemini-3.5-flash-lite
  # Replace with the Cloud Run HTTPS URL before origin checks or OAuth matter.
  _APP_ORIGIN: https://pending.invalid

steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    env:
      - DOCKER_BUILDKIT=1
    args:
      - build
      - --platform=linux/amd64
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/app:$SHORT_SHA
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/app:latest
      - .

  - id: push
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/app

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/app:$SHORT_SHA
      - --region=${_REGION}
      - --platform=managed
      - --service-account=${_RUNTIME_SA}
      - --cpu=1
      - --memory=1Gi
      - --concurrency=10
      - --timeout=300
      - --max-instances=3
      - --port=8080
      - --startup-probe=httpGet.path=/api/status,httpGet.port=8080
      - --set-env-vars=GOOGLE_CLOUD_PROJECT=$PROJECT_ID,APP_ORIGIN=${_APP_ORIGIN},GEMINI_MODEL=${_GEMINI_MODEL},MODEL_CALLS_PER_GLOBAL_DAY=1000
      - --set-secrets=GEMINI_API_KEY=teachback-gemini-key:latest,RATE_LIMIT_SECRET=teachback-rate-limit-secret:latest

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/app:$SHORT_SHA
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/app:latest

options:
  logging: CLOUD_LOGGING_ONLY
